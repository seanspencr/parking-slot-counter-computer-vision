<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parking Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #0e0e0e;
      --surface:   #161616;
      --border:    #2a2a2a;
      --text:      #f0ece3;
      --muted:     #5a5a5a;
      --green:     #b8f272;
      --red:       #ff5e5e;
      --accent:    #f0ece3;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }

    /* ── Header ── */
    header {
      width: 100%;
      max-width: 560px;
      margin-bottom: 3rem;
    }

    .label {
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: clamp(2rem, 8vw, 3.2rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.02em;
    }

    /* ── Status dot ── */
    .status-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.4s;
    }
    .dot.live  { background: var(--green); animation: pulse 2s infinite; }
    .dot.error { background: var(--red); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    .status-text {
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      color: var(--muted);
    }

    /* ── Main card ── */
    .card {
      width: 100%;
      max-width: 560px;
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
    }

    .card-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid var(--border);
    }

    .card-row:last-of-type { border-bottom: none; }

    .stat {
      padding: 2rem 1.75rem;
      position: relative;
    }

    .stat:first-child {
      border-right: 1px solid var(--border);
    }

    .stat-label {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    .stat-value {
      font-size: clamp(2.8rem, 10vw, 4.5rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.03em;
      transition: color 0.5s;
    }

    .stat-value.available { color: var(--green); }
    .stat-value.occupied  { color: var(--red); }
    .stat-value.total     { color: var(--text); }

    /* loading skeleton shimmer */
    .skeleton {
      display: inline-block;
      width: 3ch;
      height: 1em;
      border-radius: 2px;
      background: var(--border);
      animation: shimmer 1.2s infinite;
    }

    @keyframes shimmer {
      0%, 100% { opacity: 0.4; }
      50%       { opacity: 1; }
    }

    /* ── Bar ── */
    .bar-row {
      padding: 1.5rem 1.75rem;
      border-top: 1px solid var(--border);
    }

    .bar-label {
      display: flex;
      justify-content: space-between;
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.75rem;
    }

    .bar-track {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 2px;
      background: var(--green);
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1), background 0.5s;
    }

    .bar-fill.critical { background: var(--red); }

    /* ── Button ── */
    .btn-row {
      width: 100%;
      max-width: 560px;
      margin-top: 1.5rem;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 1.1rem 1.75rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: transparent;
      color: var(--text);
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }

    .btn:hover {
      background: var(--surface);
      border-color: var(--text);
    }

    .btn-icon {
      font-size: 1.1rem;
      opacity: 0.6;
    }

    /* ── Footer ── */
    footer {
      margin-top: 3rem;
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.1em;
    }

    #last-update { color: var(--muted); }

    /* ── Error banner ── */
    .error-banner {
      display: none;
      width: 100%;
      max-width: 560px;
      margin-bottom: 1rem;
      padding: 0.75rem 1.25rem;
      border: 1px solid var(--red);
      border-radius: 4px;
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      color: var(--red);
      letter-spacing: 0.05em;
    }
    .error-banner.visible { display: block; }
  </style>
</head>
<body>

  <header>
    <p class="label">Live Monitor</p>
    <h1>Parking<br>Status</h1>
    <div class="status-row">
      <div class="dot" id="dot"></div>
      <span class="status-text" id="status-text">Connecting…</span>
    </div>
  </header>

  <div class="error-banner" id="error-banner">
    ⚠ Cannot reach server — retrying…
  </div>

  <div class="card">
    <div class="card-row">
      <div class="stat">
        <p class="stat-label">Available</p>
        <div class="stat-value available" id="val-available">
          <span class="skeleton"></span>
        </div>
      </div>
      <div class="stat">
        <p class="stat-label">Occupied</p>
        <div class="stat-value occupied" id="val-occupied">
          <span class="skeleton"></span>
        </div>
      </div>
    </div>
    <div class="card-row">
      <div class="stat">
        <p class="stat-label">Total Spots</p>
        <div class="stat-value total" id="val-total">
          <span class="skeleton"></span>
        </div>
      </div>
      <div class="stat">
        <p class="stat-label">Occupancy</p>
        <div class="stat-value total" id="val-pct">
          <span class="skeleton"></span>
        </div>
      </div>
    </div>
    <div class="bar-row">
      <div class="bar-label">
        <span>Capacity</span>
        <span id="bar-label-pct">—</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" id="bar-fill"></div>
      </div>
    </div>
  </div>

  <div class="btn-row">
    <a class="btn" href="https://busboy-engraved-unstitch.ngrok-free.dev/video" target="_blank">
      <span>Live Camera Feed</span>
      <span class="btn-icon">↗</span>
    </a>
  </div>

  <footer>
    Last updated: <span id="last-update">—</span>
  </footer>

  <script>
    const API = 'https://busboy-engraved-unstitch.ngrok-free.dev/slots';
    const POLL_INTERVAL = 5000; // ms

    const dot        = document.getElementById('dot');
    const statusText = document.getElementById('status-text');
    const errBanner  = document.getElementById('error-banner');
    const elAvail    = document.getElementById('val-available');
    const elOccup    = document.getElementById('val-occupied');
    const elTotal    = document.getElementById('val-total');
    const elPct      = document.getElementById('val-pct');
    const barFill    = document.getElementById('bar-fill');
    const barPctLbl  = document.getElementById('bar-label-pct');
    const lastUpdate = document.getElementById('last-update');

    function fmt(ts) {
      if (!ts) return '—';
      return new Date(ts * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    async function fetchSlots() {
      try {
        const res  = await fetch(API);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        const { available, occupied, total, last_update } = data;
        const pct = total > 0 ? Math.round((occupied / total) * 100) : 0;

        elAvail.textContent = available;
        elOccup.textContent = occupied;
        elTotal.textContent = total;
        elPct.textContent   = pct + '%';

        barFill.style.width = pct + '%';
        barFill.classList.toggle('critical', pct >= 80);
        barPctLbl.textContent = pct + '% full';

        lastUpdate.textContent = fmt(last_update);

        dot.className        = 'dot live';
        statusText.textContent = 'Live';
        errBanner.classList.remove('visible');

      } catch (e) {
        dot.className        = 'dot error';
        statusText.textContent = 'Offline';
        errBanner.classList.add('visible');
      }
    }

    fetchSlots();
    setInterval(fetchSlots, POLL_INTERVAL);
  </script>

</body>
</html>
